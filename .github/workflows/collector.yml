name: Guntur Traffic 30-Min Auto-Collector

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Traffic Collector
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python scripts/collector.py

      - name: Commit and Push Updated Traffic Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Auto-Collector"
          git add database/traffic.db logs/scheduler_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-collected traffic data [skip ci]" && git push)
